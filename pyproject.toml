[project]
name = "pulse-boss"
version = "0.1.0"
description = "Probability-based bid recommendations for SMU BOSS course bidding"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.scripts]
pulse = "pulse.cli:main"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
